name: lint

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON manifests
        run: |
          python3 - <<'PY'
          import json, sys
          for p in [".agents/plugins/marketplace.json", ".codex-plugin/plugin.json", ".mcp.json", "hooks/hooks.json"]:
              with open(p) as f:
                  json.load(f)
              print(f"OK json {p}")
          required = {"name", "description", "version", "author", "homepage", "repository", "license", "keywords"}
          with open(".codex-plugin/plugin.json") as f:
              plug = json.load(f)
          missing = required - set(plug)
          if missing:
              print("Missing plugin.json fields:", sorted(missing), file=sys.stderr)
              sys.exit(1)
          print("OK plugin.json required fields")
          PY
      - name: Markdown presence
        run: test -f README.md && test -f skills/cachelayer-tools/SKILL.md
      - name: Python syntax check
        run: python3 -m py_compile cachelayer_tools/*.py scripts/*.py
      - name: Shell syntax check
        run: |
          for script in cachelayer_tools/*.sh scripts/*.sh; do
            test ! -f "$script" || bash -n "$script"
          done
